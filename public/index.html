<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Numerología | API Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090d16; 
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #c084fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #34d399;
            --error: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border-glass);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 5px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .status-badge {
            font-size: 11px;
            background: rgba(52, 211, 153, 0.1);
            color: var(--success);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid rgba(52, 211, 153, 0.2);
            display: none;
        }

        .result-container {
            margin-top: 15px;
            background: rgba(11, 15, 25, 0.9);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
        }

        .result-container pre {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #34d399;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .switch-hint {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .switch-hint span {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-title">
            <h1>Portal de Numerología</h1>
            <p>API REST Client Interface</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('login', this)">Entrar</button>
            <button class="tab-btn" onclick="switchTab('register', this)">Registro</button>
            <button class="tab-btn" onclick="switchTab('calc', this)">Cálculo</button>
            <button class="tab-btn" onclick="switchTab('compat', this)">Compatibilidad</button>
        </div>

        <!-- 1. SECCIÓN LOGIN -->
        <div id="login-section" class="section active">
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="tucorreo@email.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>
            <div class="switch-hint">¿No tienes cuenta? <span onclick="switchTab('register', document.querySelectorAll('.tab-btn')[1])">Regístrate aquí</span></div>
        </div>

        <!-- 2. SECCIÓN REGISTRO -->
        <div id="register-section" class="section">
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Nombre de Usuario</label>
                    <input type="text" id="reg-name" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="tucorreo@email.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>
            <div class="switch-hint">¿Ya tienes cuenta? <span onclick="switchTab('login', document.querySelectorAll('.tab-btn')[0])">Inicia sesión</span></div>
        </div>

        <!-- 3. SECCIÓN CÁLCULO DE NUMEROLOGÍA -->
        <div id="calc-section" class="section">
            <div id="token-status" class="status-badge">✔ Token activo en memoria</div>
            <form id="calc-form">
                <div class="form-group">
                    <label for="token-input">Token JWT (Bearer)</label>
                    <input type="text" id="token-input" placeholder="Se carga automáticamente al iniciar sesión">
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre / Datos para calcular</label>
                    <input type="text" id="nombre" required placeholder="Ej: David">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <input type="date" id="fecha" required>
                </div>
                <button type="submit" class="btn-submit">Calcular Numerología</button>
            </form>
            <div class="result-container">
                <pre id="result-calc">Esperando ejecución...</pre>
            </div>
        </div>

        <!-- 4. SECCIÓN COMPATIBILIDAD -->
        <div id="compat-section" class="section">
            <form id="compat-form">
                <div class="form-group">
                    <label for="compat-token">Token JWT (Bearer)</label>
                    <input type="text" id="compat-token" placeholder="Token automático">
                </div>
                <div class="form-group">
                    <label for="persona1">Fecha Persona 1</label>
                    <input type="date" id="persona1" required>
                </div>
                <div class="form-group">
                    <label for="persona2">Fecha Persona 2</label>
                    <input type="date" id="persona2" required>
                </div>
                <button type="submit" class="btn-submit">Ver Compatibilidad</button>
            </form>
            <div class="result-container">
                <pre id="result-compat">Esperando ejecución...</pre>
            </div>
        </div>
    </div>

    <script>
        // Cargar token guardado si existe al abrir la página
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('jwt_token');
            if (savedToken) {
                document.getElementById('token-input').value = savedToken;
                document.getElementById('compat-token').value = savedToken;
                document.getElementById('token-status').style.display = 'block';
            }
        });

        function saveTokenToStorage(token) {
            localStorage.setItem('jwt_token', token);
            document.getElementById('token-input').value = token;
            document.getElementById('compat-token').value = token;
            document.getElementById('token-status').style.display = 'block';
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            const map = {
                'login': 'login-section',
                'register': 'register-section',
                'calc': 'calc-section',
                'compat': 'compat-section'
            };

            document.getElementById(map[tabName]).classList.add('active');
            element.classList.add('active');
        }

        // Manejar Registro
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('¡Cuenta creada con éxito! Ahora puedes iniciar sesión.');
                    switchTab('login', document.querySelectorAll('.tab-btn')[0]);
                } else {
                    alert('Error: ' + (data.error || data.message || 'No se pudo registrar'));
                }
            } catch (err) {
                alert('Error de conexión con el servidor.');
            }
        });

        // Manejar Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    const token = data.token || data.accessToken;
                    if (token) {
                        saveTokenToStorage(token);
                        switchTab('calc', document.querySelectorAll('.tab-btn')[2]);
                    } else {
                        alert('Login exitoso pero falta el token en la respuesta.');
                    }
                } else {
                    alert('Error: ' + (data.error || data.message || 'Credenciales inválidas'));
                }
            } catch (err) {
                alert('Error de conexión con el servidor.');
            }
        });

        // Petición de Cálculo
        document.getElementById('calc-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token-input').value.trim();
            const nombre = document.getElementById('nombre').value;
            const fecha = document.getElementById('fecha').value;
            const resultBox = document.getElementById('result-calc');

            if (!token) {
                alert('Inicia sesión o ingresa un token válido.');
                return;
            }

            resultBox.innerText = 'Calculando...';
            try {
                const response = await fetch('/api/v1/numerology/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre, fecha })
                });
                const data = await response.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                resultBox.innerText = 'Error al realizar el cálculo.';
            }
        });

        // Petición de Compatibilidad (si tu endpoint usa otras variables, puedes ajustarlas aquí)
        document.getElementById('compat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('compat-token').value.trim();
            const persona1 = document.getElementById('persona1').value;
            const persona2 = document.getElementById('persona2').value;
            const resultBox = document.getElementById('result-compat');

            if (!token) {
                alert('Se requiere un token válido.');
                return;
            }

            resultBox.innerText = 'Calculando compatibilidad...';
            try {
                const response = await fetch('/api/v1/compatibility', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ persona1, persona2 })
                });
                const data = await response.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                resultBox.innerText = 'Error al consultar compatibilidad.';
            }
        });
    </script>
</body>
</html>
