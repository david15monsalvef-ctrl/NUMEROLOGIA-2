<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Numerología - Interfaz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            color: #818cf8;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .result-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }

        .toggle-text span {
            color: #818cf8;
            cursor: pointer;
            text-decoration: underline;
        }

        .token-status {
            font-size: 12px;
            color: var(--success);
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SECCIÓN DE LOGIN -->
        <div id="login-section" class="section active">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="tucorreo@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <button type="submit">Entrar y Obtener Token</button>
            </form>
            <div class="toggle-text">
                ¿Ya tienes token o quieres ir directo? <span onclick="switchSection('calc-section')">Ir al calculador</span>
            </div>
        </div>

        <!-- SECCIÓN DE CÁLCULO DE NUMEROLOGÍA -->
        <div id="calc-section" class="section">
            <h2>Calculadora de Numerología</h2>
            <div id="token-status" class="token-status"></div>
            
            <form id="calc-form">
                <div class="form-group">
                    <label for="token-input">Token JWT (Bearer):</label>
                    <input type="text" id="token-input" placeholder="Pega tu token aquí o haz login antes">
                </div>
                <!-- Ajusta los campos según lo que pida tu controlador calculate -->
                <div class="form-group">
                    <label for="nombre">Nombre / Datos:</label>
                    <input type="text" id="nombre" required placeholder="Ej: David">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha" required>
                </div>
                <button type="submit">Calcular Numerología</button>
            </form>

            <div class="toggle-text">
                <span onclick="switchSection('login-section')">Volver al Login</span>
            </div>

            <div class="result-box" id="result">El resultado aparecerá aquí...</div>
        </div>
    </div>

    <script>
        // Cambiar entre vistas
        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        // Manejar el Login (Ajusta la ruta si tu endpoint de login es diferente, ej: /api/v1/auth/login)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Asume que la API devuelve el token en data.token o data.accessToken
                    const token = data.token || data.accessToken;
                    if (token) {
                        document.getElementById('token-input').value = token;
                        document.getElementById('token-status').innerText = '✔ Token obtenido y guardado correctamente';
                        switchSection('calc-section');
                    } else {
                        alert('Login exitoso, pero no se encontró el token en la respuesta.');
                    }
                } else {
                    alert('Error: ' + (data.error || data.message || 'Credenciales inválidas'));
                }
            } catch (err) {
                console.error(err);
                alert('No se pudo conectar con el servidor.');
            }
        });

        // Manejar el envío de datos para el cálculo de Numerología
        document.getElementById('calc-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token-input').value.trim();
            const nombre = document.getElementById('nombre').value;
            const fecha = document.getElementById('fecha').value;
            const resultBox = document.getElementById('result');

            if (!token) {
                alert('Se requiere un Token JWT válido para acceder a esta ruta.');
                return;
            }

            resultBox.innerText = 'Calculando...';

            try {
                const response = await fetch('/api/v1/numerology/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre, fecha }) // Ajusta las keys según lo que espere tu backend
                });

                const data = await response.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                console.error(err);
                resultBox.innerText = 'Error al realizar la petición.';
            }
        });
    </script>
</body>
</html>
